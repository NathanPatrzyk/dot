sonar.projectKey=dot
sonar.projectName=dot
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.exclusions=**/*.config.ts,**/*.config.js,**/*.config.mjs

sonar.coverage.exclusions=**/*.test.{ts,tsx},**/*.spec.{ts,tsx},**/*.d.ts,**/*.type.{ts,tsx},**/*.types.{ts,tsx},**/*.contract.{ts,tsx},**/*.protocol.{ts,tsx},**/*.interface.{ts,tsx},**/*.mock.{ts,tsx},**/*.mocks.{ts,tsx},**/*.test-util.ts,src/types/**,src/test-utils/**,src/core/ports/**,src/db/**,src/scripts/**,src/adapters-index-*.ts,src/adapters/index.ts,src/adapters/d1/**,src/adapters/sqlite/**,src/components/ui/**,src/app/api/auth/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json